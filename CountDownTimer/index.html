<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-4">
    <h1 class="text-xl font-bold">Count down timer</h1>
    <div class="w-[800px] flex gap-5 mt-5">
      <input
        type="number"
        maxlength="2"
        oninput="this.value = this.value.slice(0, maxLength)"
        placeholder="00"
        class="hour border border-black w-10 rounded-md"
      />
      <input
        type="number"
        maxlength="2"
        oninput="this.value = this.value.slice(0, maxLength)"
        placeholder="00"
        class="minute border border-black w-10 rounded-md"
      />
      <input
        type="number"
        maxlength="2"
        oninput="this.value = this.value.slice(0, maxLength)"
        placeholder="00"
        class="second border border-black w-10 rounded-md"
      />
    </div>
    <div class="mt-5 flex gap-3">
      <button class="start border-2 border-black rounded-md py-1 px-4 font-semibold">Start</button>
      <button class="stop border-2 border-black rounded-md py-1 px-4 font-semibold">Pause</button>
      <button class="reset border-2 border-black rounded-md py-1 px-4 font-semibold">Reset</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
